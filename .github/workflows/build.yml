name: Build sleeves

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish releases on tags

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenSCAD and the label font
        run: |
          sudo apt-get update
          sudo apt-get install -y openscad fonts-dejavu-core

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install trimesh numpy scipy

      - name: Render, build 3MF plates and check meshes
        run: python3 tools/build_all.py

      - name: Zip STLs
        run: cd build && zip -r stl.zip stl

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: sleeves
          path: |
            build/3mf/*.3mf
            build/stl.zip

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/3mf/*.3mf
            build/stl.zip
          generate_release_notes: true
